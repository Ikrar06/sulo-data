name: validate

on:
  push:
    # The monitor's state branch "pantau" holds no data files.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schemas are valid JSON Schemas
        run: |
          pipx run check-jsonschema==0.29.4 --check-metaschema schema/config.schema.json
          pipx run check-jsonschema==0.29.4 --check-metaschema schema/calendar.schema.json

      - name: config.json matches the schema
        run: pipx run check-jsonschema==0.29.4 --schemafile schema/config.schema.json config.json

      - name: Calendar files match the schema
        run: pipx run check-jsonschema==0.29.4 --schemafile schema/calendar.schema.json calendar/*.json

      - name: Calendar feeds and latest.json
        run: node monitor/check-calendar.mjs

      - name: Monitor tests
        run: node --test 'monitor/*.test.mjs'
