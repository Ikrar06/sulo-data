name: unduhan

# Reads the download counts of Sulo's release files once an hour (the Android
# APK and the extension zip), as GitHub itself counts them on the release page
# of Ikrar06/sulo, and writes them down when they changed. Nobody is tracked:
# these are public totals, and nothing is added to the apps or the website.
# GitHub keeps no time for a download, so reading every hour is what tells
# roughly when one happened. The files live on the unprotected branch
# "unduhan" (main requires the validate check, which a bot push cannot pass):
# README.md (the counts at a glance), unduhan.csv (a row a day),
# unduhan-jam.csv (a reading with its time whenever a total changed) and
# unduhan.json (each file's own count).
on:
  schedule:
    # Every hour at minute 20, not on the hour (the busiest minute for
    # scheduled workflows). A day's row is the last reading of that day in
    # Makassar, so its final value is the 23.20 WITA run.
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unduhan
  cancel-in-progress: false

jobs:
  catat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rows from branch unduhan
        run: |
          if git fetch --depth=1 origin unduhan:unduhan; then
            git worktree add data unduhan
          else
            git worktree add --orphan -b unduhan data
          fi

      - name: Write the counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node unduhan/catat.mjs data

      - name: Save
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unduhan.csv unduhan-jam.csv unduhan.json README.md
          if git diff --cached --quiet; then
            echo "Tidak ada yang berubah."
          else
            git commit -m "chore: download counts $(TZ=Asia/Makassar date +%F)"
            git push origin unduhan
          fi
